function parseICS(text,driver){

  if(!m)return null;
  return {vehicle:m[1]||'',line:'',from:m[2],start:m[3],end:m[4],to:m[5]};
 }
 return events.map(function(e){
  var raw=(e.DTSTART||'').slice(0,8);
  if(!/^\d{8}$/.test(raw))return null;
  var date=raw.slice(0,4)+'-'+raw.slice(4,6)+'-'+raw.slice(6,8);
  if(e['X-GRILLOS-JSON']){
   try{var saved=JSON.parse(iu(e['X-GRILLOS-JSON']));saved.driver=driver;saved.date=date;return saved}catch(ex){}
  }
  var summary=iu(e.SUMMARY||'').trim(),desc=iu(e.DESCRIPTION||'').replace(/\\n/gi,'\n');

  if(/^(R|RR|C|VAP|VAC|MAL|CONGE)$/i.test(summary)){o.status=summary;return o}
  // Format Excel : 274 / GLYB 14:09 - 21:52 RNGK / 7h03 + 0h11
  var fields=summary.split(/\s+\/\s+/).map(function(x){return x.trim()});
  if(fields.length>=2&&/^(?:JT\s*)?\d+[A-Z0-9_-]*$/i.test(fields[0]))o.job=fields.shift().replace(/^JT\s*/i,'');
  var main=fields.shift()||summary;
  var m=/^(.+?)\s+(\d{1,2}:\d{2})\s*[-–]\s*(\d{1,2}:\d{2})\s+([A-ZÀ-Ÿ0-9_-]+)$/i.exec(main);
  if(m){o.service=m[1];o.start=m[2];o.end=m[3];o.destination=m[4]}
  else if(!o.job)o.notes=main;
  var duration=fields.join(' / ').match(/(\d+h\d{1,2})\s*\+\s*(\d+h\d{1,2})/i);
  if(duration){o.work=duration[1];o.rr=duration[2]}

  var leftovers=[];
  desc.split('\n').forEach(function(line){
   var t=parseTranche(line);
   if(t)o.segments.push(t);else if(line.trim())leftovers.push(line.trim());
  });

  return o;
 }).filter(Boolean);
}

// Cache local des derniers services : affichage immediat, puis verification serveur.
function restoreCachedServices(){
 try{var raw=localStorage.getItem(CACHE_KEY);if(!raw)return false;
  var cached=JSON.parse(raw);
  if(!cached||!Array.isArray(cached.records)||!Number.isFinite(cached.time)||Date.now()-cached.time>12*60*60*1000)return false;
  records=cached.records;loaded=true;lastSync=cached.time;return true;
 }catch(e){return false}
}
function saveCachedServices(data){
 try{localStorage.setItem(CACHE_KEY,JSON.stringify({time:Date.now(),records:data}))}catch(e){}
}
function refreshServices(show){
 if(loadingPromise)return loadingPromise;
 if(show&&!loaded)notice('Chargement des services…');
 loadingPromise=(async function(){
  try{var x=await call('listData');if(!Array.isArray(x))throw Error('Réponse serveur invalide');
   records=x;loaded=true;lastSync=Date.now();saveCachedServices(x);clearNotice();render();
  }catch(e){loaded=true;notice('Erreur de synchronisation : '+e.message);render()}
  finally{loadingPromise=null}
 })();
 return loadingPromise;
}
function load(show){return refreshServices(show)}
function checkCurrentDay(){
 var today=key(new Date());if(today===lastKnownDay)return;
 var previous=lastKnownDay;lastKnownDay=today;
 if(followToday&&selected===previous){current=new Date();selected=today;render()}
}
// Anniversaires visibles pour tous les chauffeurs, quel que soit le filtre actif.
// L'année de naissance est inconnue pour Dini et Gonzalo.
var BIRTHDAYS=[
 {name:'Arnold',day:12,month:10,year:1972},
 {name:'Patricio',day:15,month:12,year:1962},
 {name:'Pablo',day:29,month:9,year:1982},
 {name:'Dini',day:18,month:4,year:null},
 {name:'Gonzalo',day:22,month:8,year:null}
];
var birthdayPopupTimeout=null;
function birthdayMessage(person,year){
 return '¡Feliz cumpleaños, '+person.name+'!'+(person.year?' Hoy cumples '+(year-person.year)+' años.':'');
}
function updateBirthdays(){
 var now=new Date(),year=now.getFullYear(),today=[];
 for(var i=0;i<BIRTHDAYS.length;i++)if(BIRTHDAYS[i].day===now.getDate()&&BIRTHDAYS[i].month===now.getMonth()+1)today.push(BIRTHDAYS[i]);
 var banner=$('birthdayBanner'),popup=$('birthdayPopup');
 if(!today.length){banner.classList.add('hidden');popup.classList.add('hidden');return}
 var messages=today.map(function(person){return birthdayMessage(person,year)});
 banner.textContent='🎉 '+messages.join(' 🎂 ');
 banner.classList.remove('hidden');
 var storageKey='grillos_birthday_shown_'+key(now);
 var alreadyShown=false;
 try{alreadyShown=localStorage.getItem(storageKey)==='1'}catch(e){}
 if(alreadyShown||!popup.classList.contains('hidden'))return;
 try{localStorage.setItem(storageKey,'1')}catch(e){}
 $('birthdayPopupText').textContent=messages.join(' 🎂 ');
 popup.classList.remove('hidden');
 if(birthdayPopupTimeout)clearTimeout(birthdayPopupTimeout);
 birthdayPopupTimeout=setTimeout(function(){popup.classList.add('hidden')},3000);
}
function resumeCalendar(){
 if(document.hidden)return;
 checkCurrentDay();
 updateBirthdays();
 // Evite les requetes repetees quand on bascule rapidement entre applications.
 if(Date.now()-lastSync>30000){refreshServices(false);choixLoad();}
}
document.addEventListener('visibilitychange',resumeCalendar);
window.addEventListener('focus',resumeCalendar);
window.addEventListener('pageshow',resumeCalendar);
// Verification legere chaque minute; fonctionne aussi apres la veille du telephone.
setInterval(function(){if(!document.hidden){checkCurrentDay();updateBirthdays()}},60000);
setInterval(function(){if(!document.hidden){updateShiftCountdown();updateBreakCountdown();choixBannerUpdate()}},1000);
try{restoreCachedServices();render();updateBirthdays();attFetchSchool();refreshServices(!loaded);choixLoad()}catch(e){notice('Erreur JavaScript : '+e.message);console.error(e)}
})();
