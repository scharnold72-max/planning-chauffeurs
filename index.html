function shiftStartMinutes(value){
 var match=String(value||'').match(/(?:^|\D)([01]?\d|2[0-3]):([0-5]\d)(?!\d)/);

function updateShiftCountdown(){

 .map(function(r){var m=shiftStartMinutes(r.start);return {r:r,seconds:m===null?null:m*60-currentSeconds}})
 .filter(function(x){return x.seconds!==null&&x.seconds>0&&x.seconds<=3600})

// Pause entre tranches : affichage de la fin effective jusqu'au debut suivant.
// Les heures manquantes ou invalides ne produisent pas de faux compte a rebours.
function trancheMinutes(value){
 var text=String(value==null?'':value).trim();
 var match=/^(?:([01]?\d|2[0-3]):([0-5]\d))$/.exec(text);
 return match?Number(match[1])*60+Number(match[2]):null;
}
function trancheBreaks(r){
 var segments=serviceTranches(r);
 if(segments.length<2)return [];
 var base=fromKey(r.date).getTime()-12*3600000;
 var previousStart=null,previousEnd=null,breaks=[];
 for(var i=0;i<segments.length;i++){
  var start=trancheMinutes(segments[i].start),end=trancheMinutes(segments[i].end);
  if(start===null||end===null){previousStart=null;previousEnd=null;continue}
  var startAbs=base+start*60000;
  if(previousStart!==null){while(startAbs<previousStart)startAbs+=86400000}
  var endAbs=base+end*60000;
  while(endAbs<startAbs)endAbs+=86400000;
  // Aucune pause negative ou nulle; on ne deduit rien si les heures se chevauchent.
  if(previousEnd!==null&&startAbs>previousEnd){
   breaks.push({from:i,to:i+1,start:previousEnd,end:startAbs,segment:segments[i]});
  }
  previousStart=startAbs;
  previousEnd=endAbs;
 }
 return breaks;
}
function updateBreakCountdown(){
 var panel=$('breakCountdown'),host=$('breakCountdownRows');if(!panel||!host)return;

 records.filter(function(r){return dates.indexOf(r.date)!==-1&&(driver==='Tous'||r.driver===driver)}).forEach(function(r){
  trancheBreaks(r).forEach(function(b){
   if(now>=b.start&&now<b.end)active.push({r:r,b:b,seconds:Math.ceil((b.end-now)/1000)});
  });

 }).join('');

}

function dates(){if(view==='day')return [new Date(current)];if(view==='week'){var w=monday(current);return Array.from({length:7},function(_,i){return plus(w,i)})}var a=monday(new Date(current.getFullYear(),current.getMonth(),1,12));var z=new Date(current.getFullYear(),current.getMonth()+1,0,12);var end=plus(z,(7-z.getDay())%7);var out=[];for(var d=a;d<=end;d=plus(d,1))out.push(d);return out}
// Journées sans service : codes de repos, congé, vacances, maladie, etc.
function absenceCode(r){
 var codes=/^(R|RR|C|VAC|VAP|B|AC|M|MAL|CONGE|CONGÉ)$/i;
 var candidates=[r.status,r.service,r.destination];
 var code='';
 for(var i=0;i<candidates.length;i++){
  var value=String(candidates[i]||'').trim().toUpperCase();
  if(codes.test(value)){code=value;break}
 }
 if(!code)return '';
 // Ne pas masquer une vraie prise de service si des horaires existent.
 if(/\\d{1,2}:\\d{2}/.test(String(r.start||'')+' '+String(r.end||'')))return '';
 var segments=Array.isArray(r.segments)?r.segments:[];
 if(segments.some(function(x){return /\\d{1,2}:\\d{2}/.test(String(x.start||'')+' '+String(x.end||''))}))return '';
 return code;
}
function summary(r){var absence=absenceCode(r);if(absence)return absence;if(!r.service)return r.status||((r.notes||'').trim()?'Note':'—');return [r.service,[r.start,r.end].filter(Boolean).join(' - '),r.destination].filter(Boolean).join(' ')}
// Les anciennes importations ont parfois place des tranches dans le champ Notes.
// On les affiche comme tranches sans effacer les donnees originales.
var NOTE_SEPARATOR='[NOTE PERSONNELLE]';
function interpreted(r){
 var raw=String(r.notes||'').replace(/\r/g,'').trim();
 var segments=Array.isArray(r.segments)?r.segments.slice():[];
 var legacy=[],actual='';
 // Une ancienne tranche peut se trouver dans Notes même lorsque d'autres
 // tranches sont déjà enregistrées dans le champ segments.
 var parts=raw.split(NOTE_SEPARATOR);
 var oldText=parts[0]||'';
 var explicitNote=parts.length>1?parts.slice(1).join(NOTE_SEPARATOR).trim():'';
 var remaining=[];
 oldText.split('\n').forEach(function(original){
  var line=original.trim().replace(/^\/\s*/, '').trim();
  if(!line)return;
  // Ex.: "/ DP 21:00 - 00:00 DP", "SA2 1:36 - 13:46 SFN"
  if(/^(?:[A-ZÀ-Ÿ0-9_-]+\s+)?\d{1,2}:\d{2}\s*[-–]\s*\d{1,2}:\d{2}(?:\s+[A-ZÀ-Ÿ0-9_-]+)?$/i.test(line)){
   legacy.push(line);
  }else remaining.push(original.trim());
 });
 actual=[remaining.join('\n'),explicitNote].filter(Boolean).join('\n').trim();
 if(legacy.length){
  var parsed=legacy.map(function(line){
   var m=/^(.*?)\s*(\d{1,2}:\d{2})\s*[-–]\s*(\d{1,2}:\d{2})(?:\s+(.+))?$/.exec(line);
   return m?{from:m[1].trim(),start:m[2],end:m[3],to:(m[4]||'').trim(),line:'',vehicle:''}:null;
  }).filter(Boolean);
  // Les tranches sans numéro sont placées à la suite des tranches existantes.
  parsed.forEach(function(s){
   if(!segments.some(function(t){return String(t.from||'').trim()===s.from&&String(t.start||'').trim()===s.start&&String(t.end||'').trim()===s.end&&String(t.to||'').trim()===s.to}))segments.push(s);
  });
 }
 return {segments:segments,note:actual,legacy:legacy};
}
function realNote(r){return interpreted(r).note}
function serviceTranches(r){var data=interpreted(r);if(data.segments.length)return data.segments;
 if(r.service&&r.start&&r.end)return [{from:r.service,start:r.start,end:r.end,to:r.destination||'',line:'',vehicle:''}];
 return [];
}
function trancheText(s){return [s.from,s.start].filter(Boolean).join(' ')+' – '+[s.end,s.to].filter(Boolean).join(' ')}
function render(){var ds=dates();$('period').textContent=current.toLocaleDateString('fr-CH',{month:'long',year:'numeric'});$('viewDateLabel').textContent=view==='day'?fmt(current):view==='week'?'Semaine du '+european(key(ds[0]))+' au '+european(key(ds[6])):'';document.querySelector('.weekdays').innerHTML=(view==='day'?[current.toLocaleDateString('fr-CH',{weekday:'long'})]:view==='week'?ds.map(function(d){return d.toLocaleDateString('fr-CH',{weekday:'short'})}):['Lun','Mar','Mer','Jeu','Ven','Sam','Dim']).map(function(w){return '<span>'+esc(w)+'</span>'}).join('');$('calendar').style.gridTemplateColumns=view==='day'?'1fr':view==='week'?'repeat(7,minmax(0,1fr))':'repeat(7,minmax(0,1fr))';document.querySelector('.weekdays').style.gridTemplateColumns=view==='day'?'1fr':'repeat(7,minmax(0,1fr))';$('calendar').innerHTML=ds.map(function(d){var k=key(d);var rs=rows(k);var noted=rs.filter(function(r){return realNote(r).trim().length>0});var dotDrivers={};noted.forEach(function(r){dotDrivers[r.driver]=true});choixFor(k).forEach(function(x){dotDrivers[x.driver]=true});var dots=PEOPLE.filter(function(p){return dotDrivers[p]}).map(function(p){return '<span class="dot" style="--c:'+COLORS[p]+'"></span>'}).join('');var other=view==='month'&&(d.getMonth()!==current.getMonth()||d.getFullYear()!==current.getFullYear());return '<div class="day '+(other?'other ':'')+(k===key(new Date())?'today ':'')+(k===selected?'selected':'')+'" data-date="'+k+'"><div class="daynum">'+d.getDate()+'</div><div class="dots">'+dots+'</div></div>'}).join('');$('calendar').querySelectorAll('[data-date]').forEach(function(el){el.onclick=function(){selected=el.dataset.date;var d=fromKey(selected);if(view==='month'&&(d.getMonth()!==current.getMonth()||d.getFullYear()!==current.getFullYear()))current=d;if(view==='day'||view==='week')current=d;render()}});var days=ds.filter(function(d){return view!=='month'||(d.getMonth()===current.getMonth()&&d.getFullYear()===current.getFullYear())}).filter(function(d){return key(d)>=selected});$('agenda').innerHTML=days.map(function(d){var rs=rows(key(d));var cs=choixFor(key(d));if(!rs.length&&!cs.length)return '';return '<div class="agenda-day"><div class="date-title">'+esc(fmt(d))+'</div>'+cs.map(function(x){return '<div class="choix-entry" style="--choix-color:'+COLORS[x.driver]+'" data-choix="'+esc(x.id)+'"><strong>⏰ '+choixLabel(x)+'</strong><div>'+esc(european(x.date))+' à '+esc(choixTime(x.time).replace(':','h'))+'</div></div>'}).join('')+rs.map(function(r){return '<div class="service" data-id="'+esc(r.id)+'"><span class="stripe" style="--c:'+COLORS[r.driver]+'"></span><span class="service-text">'+esc(r.driver)+' / '+esc(summary(r))+'</span><span>›</span></div>'}).join('')+'</div>'}).join('')||'<div class="empty">'+(loaded?'Aucun service pour cette période.':'Chargement des services…')+'</div>';$('agenda').querySelectorAll('[data-choix]').forEach(function(el){el.onclick=function(){choixOpen(el.getAttribute('data-choix'))}});$('agenda').querySelectorAll('[data-id]').forEach(function(el){el.onclick=function(){detail(el.dataset.id)}});updateShiftCountdown();updateBreakCountdown();choixBannerUpdate()}
function move(n){followToday=false;if(view==='month'){current=new Date(current.getFullYear(),current.getMonth()+n,1,12);var today=new Date();selected=key(current.getMonth()===today.getMonth()&&current.getFullYear()===today.getFullYear()?today:current)}else{current=plus(current,n*(view==='week'?7:1));selected=key(current)}render()}

function parseICS(text,driver){
 var unfolded=[];

 }

  var date=raw.slice(0,4)+'-'+raw.slice(4,6)+'-'+raw.slice(6,8);

  var fields=summary.split(/\s+\/\s+/).map(function(x){return x.trim()});
  if(fields.length>=2&&/^(?:JT\s*)?\d+[A-Z0-9_-]*$/i.test(fields[0]))o.job=fields.shift().replace(/^JT\s*/i,'');

  var m=/^(.+?)\s+(\d{1,2}:\d{2})\s*[-–]\s*(\d{1,2}:\d{2})\s+([A-ZÀ-Ÿ0-9_-]+)$/i.exec(main);

   var t=parseTranche(line);
   if(t)o.segments.push(t);else if(line.trim())leftovers.push(line.trim());

 }).filter(Boolean);

// Cache local des derniers services : affichage immediat, puis verification serveur.
function restoreCachedServices(){
 try{var raw=localStorage.getItem(CACHE_KEY);if(!raw)return false;
  var cached=JSON.parse(raw);
  if(!cached||!Array.isArray(cached.records)||!Number.isFinite(cached.time)||Date.now()-cached.time>12*60*60*1000)return false;
  records=cached.records;loaded=true;lastSync=cached.time;return true;
 }catch(e){return false}
}
function saveCachedServices(data){
 try{localStorage.setItem(CACHE_KEY,JSON.stringify({time:Date.now(),records:data}))}catch(e){}
}
function refreshServices(show){
 if(loadingPromise)return loadingPromise;
 if(show&&!loaded)notice('Chargement des services…');
 loadingPromise=(async function(){
  try{var x=await call('listData');if(!Array.isArray(x))throw Error('Réponse serveur invalide');
   records=x;loaded=true;lastSync=Date.now();saveCachedServices(x);clearNotice();render();
  }catch(e){loaded=true;notice('Erreur de synchronisation : '+e.message);render()}
  finally{loadingPromise=null}
 })();
 return loadingPromise;
}
function load(show){return refreshServices(show)}
function checkCurrentDay(){
 var today=key(new Date());if(today===lastKnownDay)return;
 var previous=lastKnownDay;lastKnownDay=today;
 if(followToday&&selected===previous){current=new Date();selected=today;render()}
}
// Anniversaires visibles pour tous les chauffeurs, quel que soit le filtre actif.
// L'année de naissance est inconnue pour Dini et Gonzalo.
var BIRTHDAYS=[
 {name:'Arnold',day:12,month:10,year:1972},
 {name:'Patricio',day:15,month:12,year:1962},
 {name:'Pablo',day:29,month:9,year:1982},
 {name:'Dini',day:18,month:4,year:null},
 {name:'Gonzalo',day:22,month:8,year:null}
];
var birthdayPopupTimeout=null;
function birthdayMessage(person,year){
 return '¡Feliz cumpleaños, '+person.name+'!'+(person.year?' Hoy cumples '+(year-person.year)+' años.':'');
}
function updateBirthdays(){
 var now=new Date(),year=now.getFullYear(),today=[];
 for(var i=0;i<BIRTHDAYS.length;i++)if(BIRTHDAYS[i].day===now.getDate()&&BIRTHDAYS[i].month===now.getMonth()+1)today.push(BIRTHDAYS[i]);
 var banner=$('birthdayBanner'),popup=$('birthdayPopup');
 if(!today.length){banner.classList.add('hidden');popup.classList.add('hidden');return}
 var messages=today.map(function(person){return birthdayMessage(person,year)});
 banner.textContent='🎉 '+messages.join(' 🎂 ');
 banner.classList.remove('hidden');
 var storageKey='grillos_birthday_shown_'+key(now);
 var alreadyShown=false;
 try{alreadyShown=localStorage.getItem(storageKey)==='1'}catch(e){}
 if(alreadyShown||!popup.classList.contains('hidden'))return;
 try{localStorage.setItem(storageKey,'1')}catch(e){}
 $('birthdayPopupText').textContent=messages.join(' 🎂 ');
 popup.classList.remove('hidden');
 if(birthdayPopupTimeout)clearTimeout(birthdayPopupTimeout);
 birthdayPopupTimeout=setTimeout(function(){popup.classList.add('hidden')},3000);
}
function resumeCalendar(){
 if(document.hidden)return;
 checkCurrentDay();
 updateBirthdays();
 // Evite les requetes repetees quand on bascule rapidement entre applications.
 if(Date.now()-lastSync>30000){refreshServices(false);choixLoad();}
}
document.addEventListener('visibilitychange',resumeCalendar);
window.addEventListener('focus',resumeCalendar);
window.addEventListener('pageshow',resumeCalendar);
// Verification legere chaque minute; fonctionne aussi apres la veille du telephone.
setInterval(function(){if(!document.hidden){checkCurrentDay();updateBirthdays()}},60000);
setInterval(function(){if(!document.hidden){updateShiftCountdown();updateBreakCountdown();choixBannerUpdate()}},1000);
try{restoreCachedServices();render();updateBirthdays();refreshServices(!loaded);choixLoad()}catch(e){notice('Erreur JavaScript : '+e.message);console.error(e)}
})();
